<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 980" width="1200" height="980" font-family="'Cormorant Garamond', Georgia, serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Montserrat:wght@300;400;500&amp;display=swap');
    </style>

    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#FDF5F9"/>
      <stop offset="60%" stop-color="#FBEDF3"/>
      <stop offset="100%" stop-color="#F6E2EC"/>
    </radialGradient>

    <linearGradient id="petalGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E79DC2"/>
      <stop offset="1" stop-color="#F9D6E4"/>
    </linearGradient>

    <path id="petalOuter" d="M0,0 C -16,-38 -13,-86 0,-108 C 13,-86 16,-38 0,0 Z"
          fill="url(#petalGrad)" stroke="#C27CA2" stroke-width="1.3" stroke-opacity="0.7" opacity="0.95"/>
    <path id="petalInner" d="M0,0 C -19,-26 -15,-62 0,-82 C 15,-62 19,-26 0,0 Z"
          fill="url(#petalGrad)" stroke="#B96E96" stroke-width="1.2" stroke-opacity="0.8"/>

    <g id="stamen">
      <path d="M0,-2 Q 3,-20 1,-34" fill="none" stroke="#BC7398" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="1" cy="-34" r="3" fill="#E0B873"/>
    </g>

    <g id="flowerMark">
      <circle r="150" fill="#FCE7F0" opacity="0.55"/>
      <use xlink:href="#petalOuter" transform="rotate(0)"/>
      <use xlink:href="#petalOuter" transform="rotate(45)"/>
      <use xlink:href="#petalOuter" transform="rotate(90)"/>
      <use xlink:href="#petalOuter" transform="rotate(135)"/>
      <use xlink:href="#petalOuter" transform="rotate(180)"/>
      <use xlink:href="#petalOuter" transform="rotate(225)"/>
      <use xlink:href="#petalOuter" transform="rotate(270)"/>
      <use xlink:href="#petalOuter" transform="rotate(315)"/>
      <use xlink:href="#petalInner" transform="rotate(22.5)"/>
      <use xlink:href="#petalInner" transform="rotate(67.5)"/>
      <use xlink:href="#petalInner" transform="rotate(112.5)"/>
      <use xlink:href="#petalInner" transform="rotate(157.5)"/>
      <use xlink:href="#petalInner" transform="rotate(202.5)"/>
      <use xlink:href="#petalInner" transform="rotate(247.5)"/>
      <use xlink:href="#petalInner" transform="rotate(292.5)"/>
      <use xlink:href="#petalInner" transform="rotate(337.5)"/>
      <use xlink:href="#stamen" transform="rotate(0)"/>
      <use xlink:href="#stamen" transform="rotate(30)"/>
      <use xlink:href="#stamen" transform="rotate(60)"/>
      <use xlink:href="#stamen" transform="rotate(90)"/>
      <use xlink:href="#stamen" transform="rotate(120)"/>
      <use xlink:href="#stamen" transform="rotate(150)"/>
      <use xlink:href="#stamen" transform="rotate(180)"/>
      <use xlink:href="#stamen" transform="rotate(210)"/>
      <use xlink:href="#stamen" transform="rotate(240)"/>
      <use xlink:href="#stamen" transform="rotate(270)"/>
      <use xlink:href="#stamen" transform="rotate(300)"/>
      <use xlink:href="#stamen" transform="rotate(330)"/>
      <circle r="9" fill="#F5DFA8" stroke="#D9A86A" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="1200" height="980" fill="url(#bg)"/>

  <!-- HERO -->
  <g transform="translate(600,232)"><use xlink:href="#flowerMark"/></g>

  <text x="600" y="448" text-anchor="middle" font-size="104" font-weight="600"
        letter-spacing="3" fill="#8E5070">Quỳnh Anh</text>

  <!-- divider + subtitle -->
  <line x1="505" y1="494" x2="588" y2="494" stroke="#D9A86A" stroke-width="1"/>
  <line x1="612" y1="494" x2="695" y2="494" stroke="#D9A86A" stroke-width="1"/>
  <rect x="595" y="489" width="10" height="10" transform="rotate(45 600 494)" fill="#D9A86A"/>
  <text x="600" y="524" text-anchor="middle" font-family="'Montserrat', sans-serif"
        font-size="13" font-weight="300" letter-spacing="7" fill="#B07C97">HOA QUỲNH</text>

  <!-- section eyebrow -->
  <line x1="468" y1="600" x2="558" y2="600" stroke="#E1B0C8" stroke-width="1"/>
  <line x1="642" y1="600" x2="732" y2="600" stroke="#E1B0C8" stroke-width="1"/>
  <text x="600" y="605" text-anchor="middle" font-family="'Montserrat', sans-serif"
        font-size="11" font-weight="500" letter-spacing="4" fill="#C58FAB">BIẾN THỂ</text>

  <!-- variant 1: monogram -->
  <circle cx="300" cy="694" r="72" fill="#FFFBFD" stroke="#E69AB8" stroke-width="2.5"/>
  <rect x="295" y="617" width="9" height="9" transform="rotate(45 300 622)" fill="#D9A86A"/>
  <text x="302" y="722" text-anchor="middle" font-size="76" font-weight="600"
        letter-spacing="-2" fill="#8E5070">QA</text>

  <!-- variant 2: mark only -->
  <g transform="translate(600,694) scale(0.58)"><use xlink:href="#flowerMark"/></g>

  <!-- variant 3: horizontal lockup -->
  <g transform="translate(842,690) scale(0.4)"><use xlink:href="#flowerMark"/></g>
  <text x="906" y="704" font-size="40" font-weight="600" letter-spacing="1.5" fill="#8E5070">Quỳnh Anh</text>

  <!-- captions -->
  <text x="300" y="800" text-anchor="middle" font-family="'Montserrat', sans-serif"
        font-size="11" letter-spacing="2" fill="#B98EA6">MONOGRAM</text>
  <text x="600" y="800" text-anchor="middle" font-family="'Montserrat', sans-serif"
        font-size="11" letter-spacing="2" fill="#B98EA6">BIỂU TƯỢNG</text>
  <text x="945" y="800" text-anchor="middle" font-family="'Montserrat', sans-serif"
        font-size="11" letter-spacing="2" fill="#B98EA6">KHỔ NGANG</text>

  <!-- palette -->
  <g>
    <rect x="350" y="872" width="70" height="44" rx="7" fill="#FBEEF3"/>
    <rect x="436" y="872" width="70" height="44" rx="7" fill="#F3C4D6"/>
    <rect x="522" y="872" width="70" height="44" rx="7" fill="#E69AB8"/>
    <rect x="608" y="872" width="70" height="44" rx="7" fill="#B07C97"/>
    <rect x="694" y="872" width="70" height="44" rx="7" fill="#8E5070"/>
    <rect x="780" y="872" width="70" height="44" rx="7" fill="#D9A86A"/>
    <text x="385" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#FBEEF3</text>
    <text x="471" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#F3C4D6</text>
    <text x="557" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#E69AB8</text>
    <text x="643" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#B07C97</text>
    <text x="729" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#8E5070</text>
    <text x="815" y="934" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="0.5" fill="#A98498">#D9A86A</text>
  </g>
</svg>
